<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b16">
  <title>Hors ligne · Pizzeria Roma</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8f4ec;color:#243a31;font-family:Arial,Helvetica,sans-serif}.card{width:min(100%,520px);padding:clamp(28px,7vw,56px);border:1px solid #e8e1d5;border-radius:18px;background:#fff;text-align:center;box-shadow:0 18px 55px #16291a12}.brand{margin:0;color:#a63c31;font:700 12px Arial,sans-serif;letter-spacing:.2em}.brand strong{display:block;color:#1d3328;font:400 42px Georgia,serif;letter-spacing:.14em}.pizza{display:grid;place-items:center;width:72px;height:72px;margin:26px auto 18px;border-radius:50%;background:#f5e5c9;font-size:36px}.card h1{margin:0;font:400 clamp(28px,7vw,42px) Georgia,serif}.card p{margin:14px 0 24px;color:#686b63;line-height:1.6}.card a{display:inline-block;padding:12px 20px;border-radius:30px;background:#1d4933;color:white;font-weight:700;text-decoration:none}.card a:focus-visible{outline:3px solid #d5a34b;outline-offset:3px}
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">PIZZERIA<strong>ROMA</strong></p>
    <div class="pizza" aria-hidden="true">🍕</div>
    <h1>Vous êtes hors ligne</h1>
    <p>La connexion internet est momentanément indisponible. Réessayez lorsque vous serez de nouveau connecté.</p>
    <a href="/">Réessayer</a>
  </main>
</body>
</html>
